plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // Cập nhật phiên bản ở đây
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tdtu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springCloudVersion', "2023.0.3") // Cập nhật version Spring Cloud
}

dependencies {

	implementation project(':common')

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'org.springframework.boot:spring-boot-starter-actuator' // Thêm dependency actuator
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	implementation 'org.mapstruct:mapstruct:1.5.5.Final' // Thêm MapStruct

	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'com.squareup.okhttp3:okhttp'
	// Thêm OpenFeign
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0' // Thêm SpringDoc
	runtimeOnly 'com.mysql:mysql-connector-j' // Thay PostgreSQL bằng MySQL

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto' // Thêm Spring Security Crypto

	// Thêm dependency Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis' // Thêm Jedis nếu bạn sử dụng Jedis làm client

	// Spring Kafka
	implementation 'org.springframework.kafka:spring-kafka:3.2.4'

	// Temporal SDK với gRPC và protobuf được ép buộc sử dụng phiên bản an toàn hơn
	implementation 'io.temporal:temporal-sdk:1.23.0'
	implementation platform("io.grpc:grpc-bom:1.54.1")

	implementation 'io.grpc:grpc-protobuf'
	implementation 'io.grpc:grpc-netty'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}