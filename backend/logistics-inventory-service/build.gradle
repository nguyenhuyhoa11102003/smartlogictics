plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // Cập nhật phiên bản ở đây
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tdtu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springCloudVersion', "2023.0.3") // Cập nhật version Spring Cloud
}

dependencies {

	// Các dependency Spring Boot và Spring Cloud
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Spring JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest' // Spring Data REST
	implementation 'org.springframework.data:spring-data-rest-hal-explorer'

	// Các dependency bổ sung
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// OpenFeign and OkHttp
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'com.squareup.okhttp3:okhttp'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// OpenFeign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// SpringDoc
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// MySQL Connector
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'

	// Temporal SDK với gRPC và protobuf được ép buộc sử dụng phiên bản an toàn hơn
	implementation 'io.temporal:temporal-sdk:1.23.0'
	implementation platform("io.grpc:grpc-bom:1.54.1")

	implementation 'io.grpc:grpc-protobuf'
	implementation 'io.grpc:grpc-netty'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis'

	// **Ép buộc sử dụng phiên bản Guava an toàn**
	implementation 'com.google.guava:guava:32.1.2-jre' // Cập nhật phiên bản mới nhất của Guava

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Spring Kafka
	implementation 'org.springframework.kafka:spring-kafka:3.2.4'
	implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
