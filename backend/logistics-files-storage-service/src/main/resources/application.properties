spring.application.name=logistics-files-storage-service
server.port=8089
server.servlet.context-path=/file-storage

# Database configuration
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/identity_service_db
spring.datasource.username=KuAkKYzGgivBwKM.root
spring.datasource.password=yCgz18yGxy4OD18g
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.jpa.auditor-aware-ref=auditorAwareImpl
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.sort.default-order=desc


# S3 Amazon configuration using environment variables
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:banking-profile-service}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:access-key}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:secret-key}
aws.s3.region=${AWS_S3_REGION:us-east-1}

# Swagger configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/swagger-ui/profile-services.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha