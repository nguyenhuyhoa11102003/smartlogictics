plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // Cập nhật phiên bản Spring Boot nếu cần
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tdtu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

ext {
	set('springCloudVersion', "2023.0.3") // Cập nhật phiên bản Spring Cloud
}

dependencies {

	implementation project(':common')

	// OkHttp với Okio được cập nhật phiên bản an toàn
	implementation 'com.squareup.okhttp3:okhttp:4.11.0'
	implementation 'com.squareup.okio:okio:3.5.0' // Sử dụng phiên bản an toàn của Okio

	// Guava cập nhật phiên bản an toàn
	implementation 'com.google.guava:guava:32.1.2-jre'

	// Spring JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest' // Spring Data REST
	implementation 'org.springframework.data:spring-data-rest-hal-explorer'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'org.springframework.boot:spring-boot-starter-actuator' // Thêm dependency actuator
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// OpenFeign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// SpringDoc
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// MySQL Connector
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'

	// Temporal
	implementation platform('io.grpc:grpc-bom:1.50.2') // 1.50.2 phù hợp với Java 17
	implementation 'io.temporal:temporal-sdk:1.22.1' // Phiên bản ổn định với Java 17
	implementation 'io.grpc:grpc-protobuf:1.50.2'
	implementation 'io.grpc:grpc-netty:1.50.2'
	implementation 'com.google.protobuf:protobuf-java:3.21.12' // Chuyển về phiên bản an toàn

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'redis.clients:jedis'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
