plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // Cập nhật phiên bản ở đây
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tdtu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo1.maven.org/maven2/' } // Đảm bảo có repo Maven chính thức
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'

// gRPC version bom
	implementation platform('io.grpc:grpc-bom:1.50.2') // 1.50.2 phù hợp với Java 17
	implementation 'io.temporal:temporal-sdk:1.22.1' // Phiên bản ổn định với Java 17
	implementation 'io.grpc:grpc-protobuf:1.50.2'
	implementation 'io.grpc:grpc-netty:1.50.2'
	implementation 'com.google.protobuf:protobuf-java:3.21.12' // Chuyển về phiên bản an toàn


	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
