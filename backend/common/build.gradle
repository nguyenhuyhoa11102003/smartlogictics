plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.tdtu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo1.maven.org/maven2/' } // Đảm bảo có repo Maven chính thức
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Quản lý đồng bộ phiên bản gRPC
	implementation platform('io.grpc:grpc-bom:1.56.2')
	implementation 'io.temporal:temporal-sdk:1.23.0'
	implementation 'io.grpc:grpc-protobuf:1.56.2' // Chỉ định phiên bản
	implementation 'io.grpc:grpc-netty:1.56.2' // Chỉ định phiên bản
	implementation 'com.google.protobuf:protobuf-java:4.28.2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
