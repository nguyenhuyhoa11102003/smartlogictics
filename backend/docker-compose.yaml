services:
  kafka:
    image: 'bitnami/kafka:3.7.0'
    container_name: kafka-logistics
    hostname: kafka
    ports:
      - '9094:9094'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    networks:
      - yas-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis-cache:
    image: redis:7.0-alpine
    container_name: redis-cache-logistics
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis/data
    networks:
      - yas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  vault:
    image: hashicorp/vault:1.18
    container_name: vault-logistics
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID}
    command: server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID}
    volumes:
      - vault-data:/vault/file
    networks:
      - yas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15
    container_name: postgres-temporal
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporalpassword
      - POSTGRES_DB=temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - yas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporalpassword
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development_es.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7233 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:latest
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    depends_on:
      - temporal
    stdin_open: true
    tty: true
    networks:
      - yas-network

#  temporal-web:
#    container_name: temporal-web
#    image: temporalio/web:latest
#    ports:
#      - "8088:8088"
#    environment:
#      - TEMPORAL_GRPC_ENDPOINT=temporal:7233
#      - TEMPORAL_PERMIT_WRITE_API=true
#    depends_on:
#      - temporal
#    networks:
#      - yas-network

  logistics-warehouse-service:
    build:
      context: ./logistics-warehouse-service
      dockerfile: Dockerfile
    container_name: logistics-warehouse-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - kafka
      - redis-cache
      - vault
      - postgres
      - temporal
    networks:
      - yas-network

  logistics-inventory-service:
    build:
      context: ./logistics-inventory-service
      dockerfile: Dockerfile
    container_name: logistics-inventory-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - kafka
      - redis-cache
      - vault
      - postgres
      - temporal
    networks:
      - yas-network

volumes:
  vault-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local

networks:
  yas-network:
    driver: bridge
